# Pengaturan Netlify. Website ini tidak perlu proses build —
# semua file sudah siap pakai, jadi cukup ditayangkan apa adanya.
[build]
  publish = "."
  command = ""

# Alamat lama /p/<nama> dialihkan ke alamat baru /<nama>,
# supaya link yang terlanjur tersebar tidak mati.
[[redirects]]
  from = "/p/*"
  to = "/:splat"
  status = 301

# Tiap perumahan punya alamatnya sendiri langsung di akar, mis.
#   putriqonita.netlify.app/grand-harmoni-residence
# Semuanya dilayani satu berkas perumahan.html yang membaca nama perumahan
# dari alamatnya. Aturan ini TIDAK dipaksa (tanpa force), jadi berkas yang
# benar-benar ada — /admin/, /assets/, /data/ — tetap dilayani lebih dulu.
[[redirects]]
  from = "/*"
  to = "/perumahan.html"
  status = 200

# Menu admin jangan sampai terindeks Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
