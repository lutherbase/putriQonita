    <nav class="nav__menu" id="menu">

        <div>
          <strong data-i="agenNama"></strong>
          <small data-i="agenJabatan"></small>
        </div>
      </div>
    </div>
  </section>

  <section class="sec" id="daftar">
    <div class="wrap">
      <div class="sec__head">
        <span class="pill">Pilihan Hunian</span>
        <h2 class="sec__title">Perumahan yang <em>Kami Pasarkan</em></h2>
      </div>
      <div class="pgrid" id="pgrid"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
